<!doctype html>
<!-- Local boot page for the desktop shell. Shown the instant the window opens,
     before any backend exists, so it is fully self-contained: the main process
     streams boot status to it over the dshBoot bridge (preload.cjs) and
     navigates the window away once the backend answers. preload.cjs injects
     the same frameless title bar as on the real UI, hence the top padding. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DeepSeek Harness</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding-top: 36px; box-sizing: border-box;
    background: #ffffff; color: #1f2328;
    font-family: system-ui, 'Segoe UI', sans-serif;
    -webkit-app-region: drag;
    -webkit-user-select: none;
    user-select: none;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #151517; color: #f9fafb; }
  }
  main { text-align: center; max-width: 560px; padding: 0 24px; }
  .brand { font-size: 18px; font-weight: 600; letter-spacing: 0.01em; opacity: 0.9; margin-bottom: 22px; }
  /* Official DeepSeek brand whale (apps/web/public/favicon.svg path), gently
     bobbing. The favicon draws its water spout over the tail (top-right), so
     we cover that with a background-colored patch and instead animate water
     rising from the fin/blowhole area (forward of the tail) — replaces the
     old rotating spinner. */
  .whale { width: 120px; margin: 0 auto 18px; }
  .whale svg { width: 100%; height: auto; display: block; overflow: visible; }
  .whale .cover { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .whale .cover { fill: #151517; }
  }
  .whale .silhouette {
    transform-box: fill-box; transform-origin: center;
    animation: dsh-bob 3.2s ease-in-out infinite;
  }
  @keyframes dsh-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.5px); }
  }
  .whale .drop {
    fill: #8aa2ff;
    opacity: 0;
    transform-box: fill-box; transform-origin: center;
    animation: dsh-spout 2.4s linear infinite;
  }
  .whale .drop:nth-child(1) { animation-delay: 0s; }
  .whale .drop:nth-child(2) { animation-delay: 0.4s; }
  .whale .drop:nth-child(3) { animation-delay: 0.8s; }
  .whale .drop:nth-child(4) { animation-delay: 1.2s; }
  .whale .drop:nth-child(5) { animation-delay: 1.6s; }
  .whale .drop:nth-child(6) { animation-delay: 2s; }
  @keyframes dsh-spout {
    /* Parabolic jet: droplets rise from the blowhole, arc to an apex, then
       fall back — a fountain, not a straight line. */
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    8%   { opacity: 1; }
    25%  { transform: translate(3px, -7px) scale(0.8); opacity: 1; }
    50%  { transform: translate(7px, -9px) scale(0.85); opacity: 1; }
    75%  { transform: translate(11px, -5px) scale(0.7); opacity: 1; }
    100% { transform: translate(15px, 1px) scale(0.4); opacity: 0; }
  }
  #message { font-size: 13.5px; opacity: 0.75; margin: 0 0 18px; white-space: pre-line; }
  #error { display: none; }
  #detail {
    display: block; text-align: left;
    font: 11.5px/1.5 ui-monospace, Consolas, monospace;
    max-height: 180px; overflow: auto;
    white-space: pre-wrap; word-break: break-all;
    -webkit-user-select: text;
    user-select: text;
    background: rgba(128, 128, 128, 0.12);
    border: 1px solid rgba(128, 128, 128, 0.25);
    border-radius: 8px; padding: 10px 12px; margin: 0 0 16px;
  }
  #detail:empty { display: none; }
  button {
    -webkit-app-region: no-drag;
    font: inherit; font-size: 13px; padding: 7px 22px;
    color: inherit; background: rgba(128, 128, 128, 0.15);
    border: 1px solid rgba(128, 128, 128, 0.35); border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: rgba(128, 128, 128, 0.25); }
</style>
</head>
<body>
  <main>
    <div class="brand">DeepSeek Harness</div>
    <div id="spinner" class="whale" role="img" aria-label="DeepSeek 正在启动">
      <svg viewBox="0 -6 50 56" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
        <g class="silhouette">

          <!-- Hide the favicon's baked-in spout, which sits over the tail (top-right) -->
          <rect class="cover" x="40" y="0" width="10.5" height="18"/>
          <!-- Animated water droplets jetting from the fin/blowhole area,
               forward of the tail. No static line: the droplets alone form
               the spout, so nothing blocks the effect. -->
          <g class="droplets">
            <circle class="drop" cx="24" cy="3.4" r="1.2"/>
            <circle class="drop" cx="24" cy="3.4" r="1.2"/>
            <circle class="drop" cx="24" cy="3.4" r="1.2"/>
            <circle class="drop" cx="24" cy="3.4" r="1.2"/>
            <circle class="drop" cx="24" cy="3.4" r="1.2"/>
            <circle class="drop" cx="24" cy="3.4" r="1.2"/>
          </g>
        </g>
      </svg>
    </div>
    <p id="message">正在启动…</p>
    <div id="error">
      <pre id="detail"></pre>
      <button id="retry" type="button">重试</button>
    </div>
  </main>
  <script>
    'use strict'
    const spinner = document.getElementById('spinner')
    const message = document.getElementById('message')
    const error = document.getElementById('error')
    const detail = document.getElementById('detail')

    function render (status) {
      message.textContent = status.state === 'error'
        ? ('启动失败：' + (status.message || '未知错误'))
        : (status.message || '')
      spinner.style.display = status.state === 'error' ? 'none' : 'block'
      error.style.display = status.state === 'error' ? 'block' : 'none'
      detail.textContent = status.detail || ''
    }

    if (window.dshBoot) {
      window.dshBoot.onStatus(render)
      document.getElementById('retry').addEventListener('click', () => window.dshBoot.retry())
      window.dshBoot.ready()
    }
  </script>
</body>
</html>
